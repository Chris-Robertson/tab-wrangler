<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7aa2f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#89b4fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1a1b26"/>
  
  <!-- Tab stack representation -->
  <g fill="url(#grad)">
    <!-- Bottom tab -->
    <rect x="24" y="70" width="80" height="12" rx="3" opacity="0.4"/>
    <!-- Middle tab -->
    <rect x="24" y="52" width="80" height="12" rx="3" opacity="0.7"/>
    <!-- Top tab -->
    <rect x="24" y="34" width="80" height="12" rx="3" opacity="1"/>
  </g>
  
  <!-- Wrangler lasso/organize symbol -->
  <circle cx="88" cy="40" r="12" fill="none" stroke="#9ece6a" stroke-width="3"/>
  <path d="M88 52 L88 76 Q88 82 82 82 L46 82" fill="none" stroke="#9ece6a" stroke-width="3" stroke-linecap="round"/>
</svg>

